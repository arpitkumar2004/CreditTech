;; ============================================================================
;; CreditTech PgBouncer Connection Pooler Configuration
;; Staging & Production Parity Configuration for High-Concurrency OLTP
;; ============================================================================

[databases]
;; Direct connection to backend PostgreSQL instance
credittech = host=db port=5432 dbname=credittech

[pgbouncer]
;; Network configuration
listen_addr = *
listen_port = 6432

;; Authentication
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
admin_users = credittech
stats_users = credittech

;; Connection pool settings
;; 'transaction' pooling mode returns the server connection to pool immediately
;; after transaction commit/rollback, maximizing connection reuse for asyncpg/FastAPI.
pool_mode = transaction
max_client_conn = 100
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 5.0
max_db_connections = 50

;; Compatibility with asyncpg / PostgreSQL 16
;; asyncpg sends 'extra_float_digits' during handshake; PgBouncer must ignore it in transaction mode.
ignore_startup_parameters = extra_float_digits

;; Timeouts and keepalives
server_idle_timeout = 600.0
server_connect_timeout = 15.0
server_login_retry = 15.0
client_idle_timeout = 0.0
client_login_timeout = 60.0

;; Logging
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60
