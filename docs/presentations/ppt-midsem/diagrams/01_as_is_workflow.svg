<svg viewBox="0 0 980 220" width="100%" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #FFFFFF; }
    .box { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 1.5; rx: 8px; }
    .box-alert { fill: #FEF2F2; stroke: #DC2626; stroke-width: 1.5; rx: 8px; }
    .lbl { font-family: 'Segoe UI', Calibri, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #0F172A; }
    .sub { font-family: 'Segoe UI', Calibri, Arial, sans-serif; font-size: 10.5px; fill: #64748B; }
    .alert-lbl { font-family: 'Segoe UI', Calibri, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #DC2626; }
    .alert-sub { font-family: 'Segoe UI', Calibri, Arial, sans-serif; font-size: 10.5px; fill: #991B1B; font-weight: 500; }
    .arrow { stroke: #94A3B8; stroke-width: 2; marker-end: url(#arrowhead); fill: none; }
    .step-num { font-family: 'Segoe UI', Calibri, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #1E40AF; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#94A3B8" />
    </marker>
  </defs>

  <!-- Step 1 -->
  <rect class="box" x="15" y="55" width="155" height="100" />
  <circle cx="35" cy="75" r="11" fill="#DBEAFE" />
  <text class="step-num" x="35" y="79" text-anchor="middle">1</text>
  <text class="lbl" x="92" y="79" text-anchor="middle">Smallholder Farmer</text>
  <text class="sub" x="92" y="103" text-anchor="middle">• No credit history (CIBIL -1)</text>
  <text class="sub" x="92" y="120" text-anchor="middle">• Oral tenant / 0.74 ha land</text>
  <text class="sub" x="92" y="137" text-anchor="middle">• Needs ₹35,000 for Kharif</text>

  <path class="arrow" d="M170 105 H210" />

  <!-- Step 2 -->
  <rect class="box" x="215" y="55" width="160" height="100" />
  <circle cx="235" cy="75" r="11" fill="#DBEAFE" />
  <text class="step-num" x="235" y="79" text-anchor="middle">2</text>
  <text class="lbl" x="295" y="79" text-anchor="middle">Branch / PACS Visit</text>
  <text class="sub" x="295" y="103" text-anchor="middle">• Physical paper forms</text>
  <text class="sub" x="295" y="120" text-anchor="middle">• Land patta verification</text>
  <text class="sub" x="295" y="137" text-anchor="middle">• Multiple branch trips</text>

  <path class="arrow" d="M375 105 H415" />

  <!-- Step 3 -->
  <rect class="box" x="420" y="55" width="165" height="100" />
  <circle cx="440" cy="75" r="11" fill="#DBEAFE" />
  <text class="step-num" x="440" y="79" text-anchor="middle">3</text>
  <text class="lbl" x="502" y="79" text-anchor="middle">Manual Appraisal</text>
  <text class="sub" x="502" y="103" text-anchor="middle">• Loan officer inspection</text>
  <text class="sub" x="502" y="120" text-anchor="middle">• Third-party guarantor need</text>
  <text class="sub" x="502" y="137" text-anchor="middle">• Subjective discretion</text>

  <path class="arrow" d="M585 105 H625" />

  <!-- Step 4 -->
  <rect class="box" x="630" y="55" width="160" height="100" />
  <circle cx="650" cy="75" r="11" fill="#DBEAFE" />
  <text class="step-num" x="650" y="79" text-anchor="middle">4</text>
  <text class="lbl" x="710" y="79" text-anchor="middle">Bureau Check</text>
  <text class="sub" x="710" y="103" text-anchor="middle">• CIBIL score returns -1</text>
  <text class="sub" x="710" y="120" text-anchor="middle">• Thin-file automated gate</text>
  <text class="sub" x="710" y="137" text-anchor="middle">• Zero alternative signals</text>

  <path class="arrow" d="M790 105 H825" />

  <!-- Step 5 (Failure / Delay) -->
  <rect class="box-alert" x="830" y="55" width="135" height="100" />
  <text class="alert-lbl" x="897" y="85" text-anchor="middle">10–20 Days</text>
  <text class="alert-sub" x="897" y="105" text-anchor="middle">Application Rejected</text>
  <text class="alert-sub" x="897" y="122" text-anchor="middle">or Extreme Delay →</text>
  <text class="alert-sub" x="897" y="139" text-anchor="middle">Moneylender (36–48%)</text>
</svg>
