<svg viewBox="0 0 980 250" width="100%" xmlns="http://www.w3.org/2000/svg">
  <style>
    .box { fill: #F8FAFC; stroke: #CBD5E1; stroke-width: 1.5; rx: 8px; }
    .box-brand { fill: #EFF6FF; stroke: #3B82F6; stroke-width: 1.8; rx: 8px; }
    .box-success { fill: #F0FDF4; stroke: #22C55E; stroke-width: 1.5; rx: 8px; }
    .box-ingest { fill: #F1F5F9; stroke: #94A3B8; stroke-width: 1.2; rx: 6px; }
    .lbl { font-family: 'Segoe UI', Calibri, Arial, sans-serif; font-size: 12.5px; font-weight: 600; fill: #0F172A; }
    .sub { font-family: 'Segoe UI', Calibri, Arial, sans-serif; font-size: 10px; fill: #64748B; }
    .brand-lbl { font-family: 'Segoe UI', Calibri, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #1D4ED8; }
    .brand-sub { font-family: 'Segoe UI', Calibri, Arial, sans-serif; font-size: 10px; fill: #2563EB; }
    .arrow { stroke: #2563EB; stroke-width: 1.8; marker-end: url(#arrowblue); fill: none; }
    .step-badge { font-family: 'Segoe UI', Calibri, Arial, sans-serif; font-size: 10px; font-weight: 700; fill: #FFFFFF; }
  </style>
  <defs>
    <marker id="arrowblue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2563EB" />
    </marker>
  </defs>

  <!-- Step 1 -->
  <rect class="box" x="10" y="85" width="135" height="80" />
  <text class="lbl" x="77" y="115" text-anchor="middle">Farmer / SHG</text>
  <text class="lbl" x="77" y="132" text-anchor="middle">Applicant</text>
  <text class="sub" x="77" y="150" text-anchor="middle">App / Bank Sakhi</text>

  <path class="arrow" d="M145 125 H180" />

  <!-- Step 2 -->
  <rect class="box-brand" x="185" y="85" width="150" height="80" />
  <text class="brand-lbl" x="260" y="112" text-anchor="middle">Consent &amp; e-KYC</text>
  <text class="brand-sub" x="260" y="130" text-anchor="middle">• Aadhaar OTP / DigiLocker</text>
  <text class="brand-sub" x="260" y="145" text-anchor="middle">• DPDP SHA-256 ledger</text>

  <path class="arrow" d="M335 125 H370" />

  <!-- Ingestion Stack (4 Rails) -->
  <rect class="box-ingest" x="375" y="15" width="175" height="48" />
  <text class="lbl" x="462" y="36" text-anchor="middle">Account Aggregator (AA)</text>
  <text class="sub" x="462" y="52" text-anchor="middle">UPI / Bank Cashflow Trails</text>

  <rect class="box-ingest" x="375" y="72" width="175" height="48" />
  <text class="lbl" x="462" y="93" text-anchor="middle">Sentinel-2 Geospatial</text>
  <text class="sub" x="462" y="109" text-anchor="middle">10m NDVI &amp; Drought Exposure</text>

  <rect class="box-ingest" x="375" y="129" width="175" height="48" />
  <text class="lbl" x="462" y="150" text-anchor="middle">SHG / FPO Data</text>
  <text class="sub" x="462" y="166" text-anchor="middle">e-Shakti 96%+ Thrift Track</text>

  <rect class="box-ingest" x="375" y="186" width="175" height="48" />
  <text class="lbl" x="462" y="207" text-anchor="middle">KCC / Land / Bureau</text>
  <text class="sub" x="462" y="223" text-anchor="middle">ULI / State Agri Registry</text>

  <path class="arrow" d="M550 39 H595 V115" />
  <path class="arrow" d="M550 96 H600 V122" />
  <path class="arrow" d="M550 153 H600 V128" />
  <path class="arrow" d="M550 210 H595 V135" />

  <!-- Step 3: Scoring Engine -->
  <rect class="box-brand" x="600" y="85" width="175" height="80" />
  <text class="brand-lbl" x="687" y="112" text-anchor="middle">Alternative Scoring</text>
  <text class="brand-sub" x="687" y="128" text-anchor="middle">WoE Champion / GBDT</text>
  <text class="brand-sub" x="687" y="144" text-anchor="middle">Score 300–900 + SHAP Reasons</text>
  <text class="brand-sub" x="687" y="158" text-anchor="middle">&lt; 3 Minutes End-to-End</text>

  <path class="arrow" d="M775 125 H810" />

  <!-- Step 4: Regulated Lender Approval -->
  <rect class="box-success" x="815" y="85" width="155" height="80" />
  <text class="lbl" x="892" y="112" text-anchor="middle" fill="#15803D">Regulated Lender</text>
  <text class="sub" x="892" y="128" text-anchor="middle">• Underwriter review cockpit</text>
  <text class="sub" x="892" y="144" text-anchor="middle">• Sanction &amp; ULI Disbursal</text>
  <text class="sub" x="892" y="158" text-anchor="middle" font-weight="700" fill="#15803D">Same-Day Sanction</text>
</svg>
