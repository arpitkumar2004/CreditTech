[project]
name = "credittech"
version = "0.1.0"
description = "Alternative Credit Scoring System for Rural Financial Inclusion"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [
    {name = "Arpit Kumar", email = "arpit@credittech.in"},
]

dependencies = [
    # Web framework
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.0,<4.0.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.30,<3.0.0",
    "asyncpg>=0.29.0,<1.0.0",
    "alembic>=1.13.0,<2.0.0",

    # Validation & serialization
    "pydantic>=2.7.0,<3.0.0",
    "pydantic-settings>=2.3.0,<3.0.0",

    # Security
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",

    # Utilities
    "structlog>=24.1.0",
    "httpx>=0.27.0,<1.0.0",
    "tenacity>=8.3.0,<10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]
ml = [
    "scikit-learn>=1.5.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.3.0",
    "shap>=0.45.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "SIM", "TCH"]
ignore = [
    "S101",  # Allow assert in tests
    "E501",  # Long lines are OK — we care about logic, not column count
    "B008",  # FastAPI dependency injection uses call-in-default (Depends(...))
    "B904",  # `raise ... from` — reviewed case-by-case
    "S105",  # Non-secret dev defaults live in config.py; real secrets come from env
    "S104",  # Binding 0.0.0.0 inside a container is expected
]

[tool.ruff.lint.isort]
known-first-party = ["credittech"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["services*", "ml*", "apps*"]
